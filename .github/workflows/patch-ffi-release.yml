# Builds livekit-ffi for the platforms this fork ships, and publishes it as a
# GitHub Release that download_ffi.py reads.
#
# A release is a tag "livekit-ffi/v<livekit-ffi Cargo.toml version>", for
# example "livekit-ffi/v0.12.80+patch.1". workflow_dispatch builds without
# publishing.
name: FFI patch release

on:
  push:
    tags:
      - "livekit-ffi/v*+patch.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            dylib: liblivekit_ffi.dylib
            target: aarch64-apple-darwin
            macosx_deployment_target: "11.0"
            name: ffi-macos-arm64
          - os: ubuntu-latest
            platform: linux
            build_image: sameli/manylinux_2_28_x86_64_cuda_12.3
            dylib: liblivekit_ffi.so
            target: x86_64-unknown-linux-gnu
            name: ffi-linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            build_image: quay.io/pypa/manylinux_2_28_aarch64
            dylib: liblivekit_ffi.so
            target: aarch64-unknown-linux-gnu
            name: ffi-linux-arm64
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          submodules: true

      - name: Check the tag matches livekit-ffi's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' livekit-ffi/Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "livekit-ffi/v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match livekit-ffi version ${version}"; exit 1; }

      - name: Setup Rust toolchain
        if: ${{ matrix.platform == 'macos' }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Install Protoc
        if: ${{ matrix.platform == 'macos' }}
        uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2.1.0
        with:
          version: "25.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (macOS)
        if: ${{ matrix.platform == 'macos' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: cd livekit-ffi && cargo build --release --target ${{ matrix.target }}

      # manylinux images, for the widest glibc compatibility (as upstream).
      - name: Build (Linux)
        if: ${{ matrix.platform == 'linux' }}
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace ${{ matrix.build_image }} bash -c "\
            set -e; \
            yum install clang clang-devel lld -y; \
            yum install protobuf-compiler -y; \
            yum groupinstall 'Development Tools' -y; \
            yum install openssl-devel libX11-devel mesa-libGL-devel libXext-devel libva-devel libdrm-devel libgbm-devel libXdamage-devel libXrandr-devel libXfixes-devel libXcomposite-devel -y; \
            export LIBCLANG_PATH=/usr/lib64 CC=clang CXX=clang++; \
            curl --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y; \
            export PATH=/root/.cargo/bin:\$PATH; \
            cd livekit-ffi && cargo build --release --target ${{ matrix.target }}"
          sudo chown -R $USER:$USER "target/${{ matrix.target }}/release/"

      - name: Zip
        run: |
          out="target/${{ matrix.target }}/release"
          {
            echo "# livekit"; echo '```'; cat LICENSE; echo '```'
            cat livekit-ffi/WEBRTC_LICENSE.md
          } > "$out/LICENSE.md"
          cp livekit-ffi/include/livekit_ffi.h "$out/"
          cd "$out" && zip "${{ github.workspace }}/${{ matrix.name }}.zip" ${{ matrix.dylib }} livekit_ffi.h LICENSE.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "livekit-ffi built from ${GITHUB_SHA} for linux x86_64, linux arm64 and macOS arm64."
